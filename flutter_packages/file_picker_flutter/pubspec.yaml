name: tekaly_file_picker_flutter
description: "Flutter file picker implementation, on top of file_picker"
version: 0.2.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ">=12.0.0"
  file_selector: ">=1.1.0"
  path: ">=1.9.1"
  tekaly_file_picker:
    git:
      url: https://github.com/tekartikprj/tekaly
      path: packages/file_picker
dev_dependencies:
  flutter_test:
    sdk: flutter
  tekartik_lints_flutter:
    git:
      url: https://github.com/tekartik/common_flutter.dart
      path: packages/lints_flutter
    version: '>=0.1.0'

flutter:
resolution: workspace
