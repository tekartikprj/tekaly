name: tekaly_file_download_flutter_example
description: "tekaly_file_download playground, running on all platforms"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ">=1.0.9"
  tekaly_file_download:
    git:
      url: https://github.com/tekartikprj/tekaly
      path: flutter_packages/file_download
  tekaly_file_picker:
    git:
      url: https://github.com/tekartikprj/tekaly
      path: packages/file_picker
  tekaly_file_picker_flutter:
    git:
      url: https://github.com/tekartikprj/tekaly
      path: flutter_packages/file_picker_flutter

  material_ui: ">=1.5.0"
dev_dependencies:
  flutter_test:
    sdk: flutter
  tekartik_lints_flutter:
    git:
      url: https://github.com/tekartik/common_flutter.dart
      path: packages/lints_flutter
    version: '>=0.1.0'

flutter:
  uses-material-design: true
resolution: workspace
