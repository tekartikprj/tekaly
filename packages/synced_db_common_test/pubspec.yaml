name: tekaly_synced_db_common_test
description: Testing synced_db_common (shared synced source test suites)
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.12.0

# Add regular dependencies here.
dependencies:
  dev_test: ">=1.0.1"
  tekaly_synced_db_common:
    git:
      url: https://github.com/tekartikprj/tekaly
      path: packages/synced_db_common
  tekartik_common_utils:
    git:
      url: https://github.com/tekartik/common_utils.dart
  tekartik_firebase_firestore:
    git:
      url: https://github.com/tekartik/firebase_firestore.dart
      path: firestore
  tekartik_firebase_firestore_sembast:
    git:
      url: https://github.com/tekartik/firebase_firestore.dart
      path: firestore_sembast

dev_dependencies:
  lints: ">=6.1.0"
  test: ">=1.31.0"
  # Cross implementation tests (export format shared by sembast and sdb)
  idb_shim: ">=2.9.6+1"
  tekaly_sdb_synced:
    git:
      url: https://github.com/tekartikprj/tekaly
      path: packages/sdb_synced
  tekaly_sembast_synced:
    git:
      url: https://github.com/tekartikprj/tekaly
      path: packages/sembast_synced
resolution: workspace
